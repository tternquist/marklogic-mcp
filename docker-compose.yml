version: "3.9"

# Local MarkLogic 12 development environment + MCP server
services:
  marklogic:
    image: progressofficial/marklogic-db:latest
    container_name: marklogic
    ports:
      - "8000:8000"   # REST API / default App Server
      - "8001:8001"   # Admin UI
      - "8002:8002"   # Management API
      - "8020:8020"   # DHF STAGING app server (mlStagingPort)
      - "8021:8021"   # DHF FINAL app server (mlFinalPort)
      - "8022:8022"   # DHF JOBS app server (mlJobsPort)
    environment:
      - MARKLOGIC_INIT=true
      - MARKLOGIC_ADMIN_USERNAME=admin
      - MARKLOGIC_ADMIN_PASSWORD=admin
    volumes:
      - ml-data:/var/opt/MarkLogic
      # Host directory with input files for DHF ingestion steps, mounted read-only.
      # Defaults to ./ml-input at /data-in. To have MarkLogic see the files at the same
      # absolute path as your host (what DHF step configs usually reference), set both:
      #   ML_INPUT_DIR=/path/on/host  ML_INPUT_MOUNT=/path/on/host
      - ${ML_INPUT_DIR:-./ml-input}:${ML_INPUT_MOUNT:-/data-in}:ro
    # --anyauth answers whichever challenge (Digest or Basic) this image version
    # issues; the Manage API rejects unauthenticated requests with 401.
    # NOTE: first boot on a fresh volume can race the init script and exit 1 —
    # just `docker compose up` again. See docs/docker-networking.md.
    healthcheck:
      test: ["CMD", "curl", "-sf", "--anyauth", "-u", "admin:admin", "http://localhost:8002/manage/v2"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  flux-runner:
    image: ghcr.io/tternquist/marklogic-mcp/flux-runner:master
    container_name: flux-runner
    environment:
      - FLUX_PORT=8080
      - FLUX_TIMEOUT_MINUTES=30
    volumes:
      # Mount a local directory as /data inside the container.
      # Flux import/export paths should reference /data/... when using this compose file.
      - ${FLUX_DATA_DIR:-./flux-data}:/data
    # Not exposed externally — only reachable by marklogic-mcp on the internal network
    depends_on:
      marklogic:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  marklogic-mcp:
    image: ghcr.io/tternquist/marklogic-mcp:master
    container_name: marklogic-mcp
    environment:
      # --- Transport ---
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3000
      # - MCP_HTTP_HOST=0.0.0.0        # Bind address (default: 0.0.0.0)
      # - MCP_API_KEY=                  # Bearer token for HTTP transport auth — set this to secure the endpoint
      # - MCP_CORS_ORIGIN=             # Restrict CORS to a single origin (default: allow all)

      # --- MarkLogic connection ---
      - ML_HOST=marklogic
      - ML_PORT=8000
      - ML_MANAGEMENT_PORT=8002
      - ML_USERNAME=admin
      - ML_PASSWORD=admin
      - ML_AUTH_TYPE=basic
      # - ML_DATABASE=Documents        # Default content database
      # - ML_SSL=false                 # Enable HTTPS to MarkLogic
      # - ML_SSL_REJECT_UNAUTHORIZED=true  # Set false for self-signed certs
      # - ML_OAUTH_TOKEN=             # Required in stdio mode when ML_AUTH_TYPE=oauth
      # - ML_TIMEOUT_MS=30000         # HTTP request timeout (ms)

      # --- Safety ---
      - ML_READONLY=true
      - ML_ALLOW_EVAL=false

      # --- Logging ---
      - LOG_LEVEL=info
      - LOG_FORMAT=pretty

      # --- Flux sidecar ---
      - FLUX_RUNNER_URL=http://flux-runner:8080

      # --- Semaphore (Progress Data Platform — optional) ---
      # - SEMAPHORE_HOST=semaphore.example.com
      # - SEMAPHORE_SCS_PORT=5058
      # - SEMAPHORE_KMM_PORT=5080
      # - SEMAPHORE_USERNAME=
      # - SEMAPHORE_PASSWORD=
      # - SEMAPHORE_SSL=false
      # - SEMAPHORE_TIMEOUT_MS=30000

      # --- AWS QuickSight (optional) ---
      # - AWS_REGION=us-east-1
      # - AWS_QUICKSIGHT_ACCOUNT_ID=

      # --- Data Hub Framework (optional) ---
      # - ML_DHF_CLIENT_JAR=          # Path to marklogic-data-hub-<ver>-client.jar (bundled in Docker image)
      # - ML_DHF_PORT=                # DHF staging app server port (defaults to ML_PORT)
      # - ML_DHF_JOBS_PORT=           # DHF jobs app server port (defaults to ML_DHF_PORT+2)

      # -----------------------------------------------------------------------
      # NOTE: AI provider API keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.)
      # are NOT used by this MCP server. They are configured in your AI client
      # (Claude Desktop, Claude Code, OpenAI-compatible agents, etc.).
      # See the README "AI Client API Keys" section for details.
      # -----------------------------------------------------------------------
    ports:
      - "3000:3000"
    depends_on:
      marklogic:
        condition: service_healthy
      flux-runner:
        condition: service_healthy

volumes:
  ml-data:
